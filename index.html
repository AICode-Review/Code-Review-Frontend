<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#3956DD" />
    <meta
      name="description"
      content="Scrutinye finds high-impact bugs, verifies every claim, and keeps noisy AI comments off your pull requests."
    />
    <meta name="robots" content="index, follow" />
    <title>Scrutinye — AI code review your team can trust</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Static defaults for non-JS link-unfurlers (Slack/Twitter/LinkedIn) and the first
         paint before React mounts. src/components/Seo.tsx overrides these per route once
         the app loads — see that file's comment for why both layers exist. -->
    <link rel="canonical" href="https://scrutinye.dev/" />
    <meta property="og:site_name" content="Scrutinye" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scrutinye.dev/" />
    <meta property="og:title" content="Scrutinye — AI code review your team can trust" />
    <meta
      property="og:description"
      content="Scrutinye finds high-impact bugs, verifies every claim, and keeps noisy AI comments off your pull requests."
    />
    <meta property="og:image" content="https://scrutinye.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scrutinye — AI code review your team can trust" />
    <meta
      name="twitter:description"
      content="Scrutinye finds high-impact bugs, verifies every claim, and keeps noisy AI comments off your pull requests."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scrutinye",
        "url": "https://scrutinye.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "AI code review that cross-examines every finding with a second model before it reaches your pull request.",
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro", "price": "19", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Team", "price": "35", "priceCurrency": "USD" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
